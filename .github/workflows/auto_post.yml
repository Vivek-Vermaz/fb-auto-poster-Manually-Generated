name: Auto Poster Workflow

on:
  schedule:
    # Runs at the top of every hour
    - cron: '0 * * * *'
  # Allow manual trigger from Actions tab or Web Dashboard
  workflow_dispatch:
    inputs:
      test_page_name:
        description: 'Page Name to force a test post for'
        required: false
        default: ''
      refresh_only:
        description: 'Set to true to only refresh inventory counts without posting'
        required: false
        default: 'false'

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  run-automation:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        ref: ${{ github.head_ref }}
        
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        
    - name: Run Background Script
      env:
        TEST_PAGE_NAME: ${{ github.event.inputs.test_page_name }}
        REFRESH_ONLY: ${{ github.event.inputs.refresh_only }}
        FB_PAGES_CREDENTIALS: ${{ secrets.FB_PAGES_CREDENTIALS }}
        CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
        CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
        CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
        GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
        GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      run: |
        python main.py
        
    - name: Commit state.json and config.json
      uses: stefanzweifel/git-auto-commit-action@v5
      with:
        commit_message: "Auto-update: Saving state and config history"
        file_pattern: "docs/*.json"
